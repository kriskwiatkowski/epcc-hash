[workspace]
members = [
    "runtime/board-support",
    "runtime/targets/cortex-m3",
    "runtime/targets/cortex-m33",
    "runtime/targets/stm32h573i-dk",
    "sha3",
    "sha3/test/bench",
    "sha3/test/device",
    "sha3/test/host",
    "sha3/test/ut",
    "sha3/test/kat",
    "xtask",
]
resolver = "3"

default-members = ["sha3", "sha3/test/ut", "sha3/test/bench"]
exclude = ["3rd/stm32h5xx-hal"]

[profile.dev]
opt-level = 0
panic = "abort"
overflow-checks = false

[profile.release]
opt-level = "s"
lto = false
panic = "abort" # Don't use unwinding on embedded
# "symbols" (the stronger option) would also strip _SEGGER_RTT, which
# probe-rs's RTT auto-attach needs to find in the ELF symbol table.
strip = "debuginfo"
codegen-units = 1       # Better optimization
overflow-checks = false

[profile.test]
opt-level = 0

[workspace.dependencies]
board-support = { path = "runtime/board-support" }
# "dut" (device under test) is the fixed name runtime/targets/*'s harness
# imports from; it's what lets those crates stay free of any algorithm-
# specific naming. Only this one line, not anything under runtime/, would
# need to change (to a `[patch]`) once runtime/ becomes its own repo.
dut = { path = "sha3/test/device" }
keccak-test = { path = "sha3/test/ut" }
keccak-kat = { path = "sha3/test/kat" }
sha3-bench = { path = "sha3/test/bench" }
stm32h5xx-hal = { path = "3rd/stm32h5xx-hal" }
epcc-keccak = { path = "sha3" }
env_logger = "0.11"
