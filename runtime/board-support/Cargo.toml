[package]
name = "board-support"
version = "0.1.0"
edition = "2021"
# Deliberately free of anything algorithm-specific (no SHA3/Keccak/etc
# awareness): this, and the generic target crates under `runtime/targets/`,
# are meant to be split into their own `runtime` repo once they've had a few
# more iterations, and consumed from there by every crypto project. For now
# they stay inside epcc-hash, which is their first real consumer/test bed.

[lib]
test = false
doctest = false

# Exactly one of these must be enabled; which one picks the `Board`
# implementation re-exported from `lib.rs` (see ariel-os's per-board YAML +
# generated-module pattern, which this borrows a lightweight version of).
[features]
board-semihosting = ["cortex-m-semihosting", "panic-semihosting"]
board-stm32h573i-dk = ["stm32h5xx-hal", "rtt-target", "panic-probe", "embedded-io", "log"]

[dependencies]
cfg-if = "1.0.0"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-semihosting = { version = "0.5", optional = true }
panic-semihosting = { version = "0.6", optional = true }
embedded-io = { version = "0.7", optional = true }
log = { version = "0.4.29", optional = true }
panic-probe = { version = "0.3", optional = true }
rtt-target = { version = "0.5.0", optional = true }

stm32h5xx-hal = { workspace = true, optional = true, features = [
    "stm32h573",
    "rt",
] }
