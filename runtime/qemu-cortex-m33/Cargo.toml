[package]
name = "cortex-m33"
version = "0.1.0"
edition = "2021"
build = "../common/build.rs"

[[bin]]
name = "cortex-m33-tests"
path = "../common/src/arm_m/tests.rs"
test = false
bench = false

[[bin]]
name = "cortex-m33-bench"
path = "../common/src/arm_m/bench.rs"
test = false
bench = false

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-semihosting = "0.6"
keccak-test = { workspace = true }    #, features = ["semihosting-log"] }
runtime-common = { workspace = true }

[features]
std = []
# Selects the bit-interleaved 32-bit-lane permutation (`state: [u32; 50]`)
# instead of the default 64-bit-lane one (`state: [u64; 25]`). Chosen
# manually per build, e.g. for targets without efficient 64-bit ops;
# mutually exclusive with the default.
keccak32bit = []
default = ["keccak32bit"]
