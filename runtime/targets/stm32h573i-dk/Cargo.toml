[package]
name = "stm32h573i-dk"
version = "0.1.0"
edition = "2021"
build = "../common/build.rs"

[[bin]]
name = "stm32h573i-dk-tests"
path = "../common/tests.rs"
test = false
bench = false

[[bin]]
name = "stm32h573i-dk-bench"
path = "../common/bench.rs"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
board-support = { workspace = true, features = ["board-stm32h573i-dk"] }
dut = { workspace = true }
