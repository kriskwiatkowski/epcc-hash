[package]
name = "stm32h573i-dk"
version = "0.1.0"
edition = "2021"
build = "../common/build.rs"

[[bin]]
name = "stm32h573i-dk-tests"
path = "src/tests.rs"
test = false
bench = false

[[bin]]
name = "stm32h573i-dk-bench"
path = "src/bench.rs"
test = false
bench = false

[features]
default = ["log-rtt"]
log-rtt = ["rtt-target"]

[dependencies]
cfg-if = "1.0.0"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
log = { version = "0.4.29" }
panic-probe = { version = "0.3" }
rtt-target = { version = "0.5.0", optional = true }
runtime-common = { path = "../common" }

stm32h5xx-hal = { path = "../../3rd/stm32h5xx-hal", default-features = false, features = [
    "stm32h573",
    "rt",
] }
keccak-test = { path = "../../keccak/test" }
