[package]
name = "epcc-keccak"
version = "0.1.0"
edition = "2021"
build = "build/build.rs"

[lib]
crate-type = ["rlib"]
test = false
doctest = false
bench = false

[features]
std = []
default = ["std"]

[dependencies]
cfg-if = "1.0.4"

[dev-dependencies]
katwalk = { version = "0.1.0" }
env_logger = { version = "0.11" }
cortex-m-semihosting = { version = "0.5" }
